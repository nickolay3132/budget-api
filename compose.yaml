services:
  postgres:
    image: 'postgres:18-alpine'
    container_name: budget-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - budget-db-data:/var/lib/postgresql

volumes:
  budget-db-data:
